<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina Diária</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-border:#262e38;
    --accent:#00d4ff;
    --accent-dim:#0a8ba8;
    --text:#e6edf3;
    --text-dim:#8b98a5;
    --ok:#3fb950;
    --warn:#d29922;
    --danger:#f85149;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
    padding:20px 16px 110px;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:20px;
  }
  header h1{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
  }
  header .data{
    color:var(--text-dim);
    font-family:'DM Mono', monospace;
    font-size:13px;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:4px;
  }
  .tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 4px;
    border-radius:8px;
  }
  .tabs button.ativa{
    background:var(--accent);
    color:#00161c;
  }
  .kpi-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .kpi{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px;
  }
  .kpi .label{
    color:var(--text-dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin-bottom:6px;
  }
  .kpi .value{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--accent);
  }
  .status-banner{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .status-banner.on{border-color:var(--ok); color:var(--ok);}
  .status-banner.off{border-color:var(--warn); color:var(--warn);}
  .status-banner button{
    margin-left:auto;
    background:var(--accent);
    color:#00161c;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:12px;
  }
  .lista{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }
  .item{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .item .hora{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--accent);
    min-width:56px;
  }
  .item .miolo{
    flex:1;
    min-width:0;
  }
  .item .texto{
    font-size:15px;
  }
  .item .tag{
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
    font-family:'DM Mono', monospace;
  }
  .item.feito .texto{
    color:var(--text-dim);
    text-decoration:line-through;
  }
  .item .check{
    width:26px;
    height:26px;
    border-radius:8px;
    border:2px solid var(--panel-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:var(--ok);
    flex-shrink:0;
  }
  .item.feito .check{
    background:var(--ok);
    border-color:var(--ok);
    color:#04220c;
  }
  .acoes-card{
    display:flex;
    flex-shrink:0;
  }
  .btn-icone{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:18px;
    min-width:38px;
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }
  .btn-icone:active{
    background:var(--bg);
  }
  .item.atrasada{
    border-color:var(--danger);
  }
  .item.atrasada .hora{
    color:var(--danger);
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 8px;
    border-radius:6px;
    margin-left:8px;
    vertical-align:middle;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .badge.amanha{
    background:var(--warn);
    color:#2b1c00;
  }
  .badge.atrasada{
    background:var(--danger);
    color:#2c0906;
  }
  .coluna-titulo{
    display:flex;
    align-items:center;
    gap:8px;
    margin:22px 0 10px;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--text-dim);
  }
  .coluna-titulo:first-child{ margin-top:0; }
  .coluna-titulo .ponto{
    width:9px;
    height:9px;
    border-radius:50%;
  }
  .coluna-titulo .contagem{
    margin-left:auto;
    font-family:'DM Mono', monospace;
    font-size:12px;
  }
  .vazio-coluna{
    color:var(--text-dim);
    font-size:13px;
    padding:8px 2px 4px;
  }
  .quadro{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    padding-bottom:8px;
    margin-bottom:24px;
  }
  .coluna-quadro{
    flex:0 0 80%;
    scroll-snap-align:start;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:100px;
  }
  .coluna-quadro .coluna-titulo{
    margin:0 0 12px;
  }
  .coluna-quadro .item{
    margin-bottom:10px;
  }
  .coluna-quadro .item:last-child{
    margin-bottom:0;
  }
  .vazio{
    color:var(--text-dim);
    text-align:center;
    padding:30px 10px;
    font-size:14px;
  }
  .fab{
    position:fixed;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    width:54px;
    height:54px;
    border-radius:50%;
    background:var(--accent);
    color:#00161c;
    border:none;
    font-size:28px;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    z-index:20;
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    z-index:30;
  }
  .overlay.aberto{ display:flex; }
  .painel-form{
    background:var(--panel);
    border-top:1px solid var(--panel-border);
    border-radius:16px 16px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    max-height:85vh;
    overflow-y:auto;
  }
  .painel-form h2{
    font-family:'Rajdhani', sans-serif;
    font-size:20px;
    font-weight:700;
  }
  .campo{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .campo label{
    font-size:12px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .campo input, .campo select{
    background:var(--bg);
    border:1px solid var(--panel-border);
    color:var(--text);
    border-radius:8px;
    padding:11px;
    font-family:'DM Sans', sans-serif;
    font-size:15px;
  }
  .tipo-row{
    display:flex;
    gap:8px;
  }
  .tipo-row button{
    flex:1;
    background:var(--bg);
    border:1px solid var(--panel-border);
    color:var(--text-dim);
    border-radius:8px;
    padding:10px 4px;
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .tipo-row button.selecionado{
    background:var(--accent);
    color:#00161c;
    border-color:var(--accent);
  }
  .dias-semana, .dias-mes{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .dias-mes button{
    aspect-ratio:1;
    border-radius:10px;
    background:var(--bg);
    border:1px solid var(--panel-border);
    color:var(--text-dim);
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:0;
  }
  .dias-mes button.selecionado{
    background:var(--accent);
    color:#00161c;
    border-color:var(--accent);
  }
  .dias-semana button{
    aspect-ratio:1;
    padding:0;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--panel-border);
    color:var(--text-dim);
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .dias-semana button.selecionado{
    background:var(--accent);
    color:#00161c;
    border-color:var(--accent);
  }
  .painel-form .acoes{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .painel-form .acoes button{
    flex:1;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .btn-cancelar{
    background:var(--bg);
    color:var(--text-dim);
    border:1px solid var(--panel-border) !important;
  }
  .btn-salvar{
    background:var(--accent);
    color:#00161c;
  }
  .ajuda{
    font-size:12px;
    color:var(--text-dim);
    line-height:1.5;
    padding:14px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
  }
  .tipo-row button{ font-size:12px; }
  .badge.encerrada{ background:var(--panel-border); color:var(--text-dim); }
  .calendario{
    background:var(--bg);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:10px;
  }
  .cal-topo{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; font-weight:600; font-size:14px;
  }
  .cal-topo button{
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text); border-radius:8px; width:40px; height:36px; font-size:20px;
  }
  .cal-grade{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-sem{ text-align:center; font-size:11px; color:var(--text-dim); padding:2px 0; }
  .cal-grade button{
    aspect-ratio:1; border-radius:8px; background:var(--panel);
    border:1px solid transparent; color:var(--text);
    font-family:'DM Sans', sans-serif; font-size:13px; padding:0;
  }
  .cal-grade button.hoje{ border-color:var(--accent); }
  .cal-grade button.selecionado{ background:var(--accent); color:#00161c; font-weight:700; }
  .cal-grade button:disabled{ opacity:0.3; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{
    background:var(--panel); border:1px solid var(--accent-dim); color:var(--accent);
    border-radius:999px; padding:6px 10px; font-size:12px;
  }
  .chips-vazio{ font-size:12px; color:var(--text-dim); }
  .linha-alarme{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .linha-alarme .chk{ display:flex; align-items:center; gap:8px; font-size:13px; flex:1; }
  .linha-alarme .chk input{ width:20px; height:20px; accent-color:var(--accent); }
  .btn-teste{
    background:var(--bg); border:1px solid var(--panel-border); color:var(--accent);
    border-radius:8px; padding:9px 12px; font-size:12px; font-weight:600;
  }
  .alarme-overlay{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(13,17,23,0.96);
    align-items:center; justify-content:center; padding:20px;
  }
  .alarme-overlay.aberto{ display:flex; }
  .alarme-caixa{
    width:100%; max-width:380px; text-align:center;
    background:var(--panel); border:2px solid var(--accent); border-radius:18px;
    padding:28px 20px; animation:pulsa 1.2s infinite;
  }
  @keyframes pulsa{
    0%,100%{ box-shadow:0 0 0 0 rgba(0,212,255,0.45); }
    50%{ box-shadow:0 0 0 18px rgba(0,212,255,0); }
  }
  .alarme-icone{ font-size:48px; }
  .alarme-hora{ font-family:'DM Mono', monospace; font-size:44px; color:var(--accent); margin:6px 0; }
  .alarme-texto{ font-family:'Rajdhani', sans-serif; font-size:24px; font-weight:700; margin-bottom:6px; word-break:break-word; }
  .alarme-extra, .alarme-aviso{ font-size:12px; color:var(--text-dim); min-height:16px; }
  .alarme-botoes{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .alarme-botoes button{
    border:none; border-radius:12px; padding:15px;
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:18px;
  }
  .a-concluir{ background:var(--ok); color:#04170a; }
  .a-adiar{ background:var(--warn); color:#1c1400; }
  .a-parar{ background:var(--bg); color:var(--text-dim); border:1px solid var(--panel-border) !important; }
  .nota{ font-size:12px; color:var(--text-dim); margin-top:3px; white-space:pre-wrap; word-break:break-word; }
  .campo textarea{
    background:var(--bg); border:1px solid var(--panel-border); color:var(--text);
    border-radius:8px; padding:11px; font-family:'DM Sans', sans-serif; font-size:15px;
    resize:vertical; min-height:60px;
  }
  .ferramentas{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .ferramentas h3{ font-family:'Rajdhani', sans-serif; font-size:16px; margin-bottom:10px; }
  .ferramentas .grade{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ferramentas button{
    background:var(--bg); border:1px solid var(--panel-border); color:var(--text);
    border-radius:10px; padding:12px 8px; font-family:'DM Sans', sans-serif; font-size:13px; font-weight:600;
  }
  .ferramentas button.ligado{ background:var(--accent); color:#00161c; border-color:var(--accent); }
  .ferramentas .msg{ font-size:12px; color:var(--text-dim); margin-top:8px; min-height:16px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:14px; }
  .stat .rot{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .stat .val{ font-family:'DM Mono', monospace; font-size:26px; color:var(--accent); margin-top:4px; }
  .stat .sub{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .stat-bloco{ background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:14px; margin-top:10px; }
  .stat-bloco h3{ font-family:'Rajdhani', sans-serif; font-size:16px; margin-bottom:10px; }
  .barras{ display:flex; align-items:flex-end; gap:8px; height:110px; }
  .barra-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  .barra{ width:100%; border-radius:6px 6px 0 0; background:var(--accent); min-height:3px; }
  .barra.vazia{ background:var(--panel-border); }
  .barra.cheia{ background:var(--ok); }
  .barra-pct{ font-size:10px; color:var(--text-dim); }
  .barra-dia{ font-size:11px; color:var(--text-dim); }
  .rank-linha{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:7px 0; border-top:1px solid var(--panel-border); }
  .rank-linha:first-of-type{ border-top:none; }
  .rank-linha span:last-child{ color:var(--warn); font-family:'DM Mono', monospace; white-space:nowrap; }
  .filtro-cat{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; }
  .filtro-cat button, .cat-row button{
    flex-shrink:0; background:var(--bg); border:1px solid var(--panel-border); color:var(--text-dim);
    border-radius:999px; padding:7px 12px; font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .filtro-cat button.ativa, .cat-row button.selecionado{ border-color:var(--accent); color:var(--text); background:var(--panel); }
  .cat-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .cat-ponto{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .item.com-cat{ border-left:4px solid var(--cat-cor); }
</style>
</head>
<body>

<header>
  <h1>ROTINA DIÁRIA</h1>
  <div class="data" id="dataHoje">carregando...</div>
</header>

<div id="statusBanner" class="status-banner off">
  Notificações desativadas
  <button id="btnAtivar">Ativar</button>
</div>

<div class="tabs">
  <button id="tabHoje" class="ativa">Hoje</button>
  <button id="tabTodas">Todas as tarefas</button>
  <button id="tabStats">Estatísticas</button>
</div>

<div class="tabs" id="modoQuadroRow" style="display:none;">
  <button id="modoColunas" class="ativa">Colunas</button>
  <button id="modoEmpilhado">Empilhado</button>
</div>

<div class="filtro-cat" id="filtroCat" style="display:none;"></div>

<div class="kpi-row" id="kpiRow">
  <div class="kpi">
    <div class="label">Feitos hoje</div>
    <div class="value" id="kpiFeitos">0/0</div>
  </div>
  <div class="kpi">
    <div class="label">Próximo</div>
    <div class="value" id="kpiProximo">--:--</div>
  </div>
</div>

<div class="lista" id="lista"></div>

<div class="ferramentas">
  <h3>Ferramentas</h3>
  <div class="grade">
    <button type="button" id="btnBackup">Salvar backup</button>
    <button type="button" id="btnRestaurar">Restaurar backup</button>
    <button type="button" id="btnIcs">Enviar para a agenda</button>
    <button type="button" id="btnTela">Tela sempre acesa: desligada</button>
  </div>
  <input type="file" id="arqBackup" accept=".json,application/json" style="display:none">
  <div class="msg" id="msgFerramentas"></div>
</div>

<div class="ajuda" id="ajuda"></div>

<button class="fab" id="btnAbrirForm">+</button>

<div class="overlay" id="overlay">
  <div class="painel-form">
    <h2 id="tituloForm">Nova ação</h2>

    <div class="campo">
      <label>Horário</label>
      <input type="time" id="novaHora" value="08:00">
    </div>

    <div class="campo">
      <label>Descrição</label>
      <input type="text" id="novoTexto" placeholder="ex: enviar relatório">
    </div>

    <div class="campo">
      <label>Observação (opcional)</label>
      <textarea id="novaNota" placeholder="ex: ligar para o fornecedor, número do contrato"></textarea>
    </div>

    <div class="campo">
      <label>Categoria (opcional)</label>
      <div class="cat-row" id="catRow"></div>
    </div>

    <div class="campo">
      <label>Repetição</label>
      <div class="tipo-row">
        <button type="button" data-tipo="diaria" class="selecionado">Diária</button>
        <button type="button" data-tipo="semanal">Semanal</button>
        <button type="button" data-tipo="mensal">Mensal</button>
        <button type="button" data-tipo="datas">Datas</button>
      </div>
    </div>

    <div class="campo" id="campoDias" style="display:none;">
      <label>Dias da semana</label>
      <div class="dias-semana" id="diasSemana"></div>
    </div>

    <div class="campo" id="campoDiaMes" style="display:none;">
      <label>Dias do mês (pode marcar vários)</label>
      <div class="dias-mes" id="diasMesGrid"></div>
    </div>

    <div class="campo" id="campoDatas" style="display:none;">
      <label>Escolha as datas no calendário</label>
      <div class="calendario">

<script>
const STORAGE_KEY = 'rotina_itens_v2';
const ESTADOS_KEY = 'rotina_estados_v1';
const DISPAROS_KEY = 'rotina_disparos_v1';
const SONECAS_KEY = 'rotina_sonecas_v1';
const JANELA_MIN = 15;
const SONECA_MIN = 10;
const SOM_MAX_MS = 180000;
const DIAS_LABEL = ['D','S','T','Q','Q','S','S'];
const DIAS_NOME = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const CATEGORIAS = [
  { id:'trabalho', nome:'Trabalho', cor:'#00d4ff' },
  { id:'pessoal', nome:'Pessoal', cor:'#bc8cff' },
  { id:'saude', nome:'Saúde', cor:'#3fb950' },
  { id:'casa', nome:'Casa', cor:'#d29922' },
  { id:'estudo', nome:'Estudo', cor:'#58a6ff' },
  { id:'financas', nome:'Finanças', cor:'#f0883e' }
];
const catPorId = (id) => CATEGORIAS.find(c => c.id === id) || null;
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const $ = (id) => document.getElementById(id);

function lerJSON(chave, padrao){
  try{
    const raw = localStorage.getItem(chave);
    if(!raw) return padrao;
    const v = JSON.parse(raw);
    return (v && typeof v === 'object') ? v : padrao;
  }catch(e){ return padrao; }
}
function gravarJSON(chave, v){
  try{ localStorage.setItem(chave, JSON.stringify(v)); }catch(e){}
}

// Data local (YYYY-MM-DD). Não usa UTC, para não virar o dia às 21h no horário de Brasília.
function dataStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function hojeDate(){ return new Date(); }
function hojeStr(){ return dataStr(hojeDate()); }
function dataDeStr(s){
  const [a,m,d] = s.split('-').map(Number);
  return new Date(a, m-1, d);
}
function minutosDe(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + m;
}
function formatarDataCurta(s){
  const [ano, mes, dia] = s.split('-');
  return `${dia}/${mes}`;
}
function formatarDataLonga(s){
  const d = dataDeStr(s);
  return `${DIAS_NOME[d.getDay()].slice(0,3)} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function carregarItens(){
  const v = lerJSON(STORAGE_KEY, []);
  return Array.isArray(v) ? v : [];
}
function salvarItens(v){ gravarJSON(STORAGE_KEY, v); }

// estados[item.id] = { ultimaConclusao, pendenteDesde }
// pendenteDesde só é apagado quando o usuário marca a tarefa como concluída.
function carregarEstados(){
  const v = lerJSON(ESTADOS_KEY, {});
  // corrige datas futuras gravadas por engano pela versão antiga (que usava UTC)
  const hj = hojeStr();
  Object.values(v).forEach(est => {
    if(est && est.ultimaConclusao && est.ultimaConclusao > hj) est.ultimaConclusao = hj;
    if(est && est.pendenteDesde && est.pendenteDesde > hj) est.pendenteDesde = hj;
  });
  return v;
}
function salvarEstados(v){ gravarJSON(ESTADOS_KEY, v); }

let itens = carregarItens();
let estados = carregarEstados();
let disparos = lerJSON(DISPAROS_KEY, {});
const HISTORICO_KEY = 'rotina_historico_v1';
const INICIO_KEY = 'rotina_stats_inicio';
let historico = lerJSON(HISTORICO_KEY, {});
let statsInicio = null;
try{ statsInicio = localStorage.getItem(INICIO_KEY); if(!statsInicio){ statsInicio = dataStr(new Date()); localStorage.setItem(INICIO_KEY, statsInicio); } }catch(e){ statsInicio = dataStr(new Date()); }
let sonecas = lerJSON(SONECAS_KEY, {});
let abaAtual = 'hoje';
let modoQuadro = 'colunas';
try{ modoQuadro = localStorage.getItem('rotina_modo_quadro') || 'colunas'; }catch(e){}
let tipoSelecionado = 'diaria';
let diasSelecionados = [];
let diasMesSelecionados = [];
let datasSelecionadas = [];
let editandoId = null;
let catSelecionada = '';
let filtroCategoria = '';
try{ filtroCategoria = localStorage.getItem('rotina_filtro_cat') || ''; }catch(e){}
let calAno = new Date().getFullYear();
let calMes = new Date().getMonth();

function ordenarPorHora(lista){
  return [...lista].sort((a,b) => a.hora.localeCompare(b.hora));
}

// Dias do mês de um item mensal (aceita o formato antigo, com um único diaMes)
function diasMesDe(item){
  if(Array.isArray(item.diasMes)) return item.diasMes.map(Number);
  if(item.diaMes) return [Number(item.diaMes)];
  return [];
}

function itemDevidoHoje(item, data){
  if(item.tipo === 'semanal') return (item.dias || []).includes(data.getDay());
  if(item.tipo === 'mensal') return diasMesDe(item).includes(data.getDate());
  if(item.tipo === 'datas') return (item.datas || []).includes(dataStr(data));
  return true;
}

// Dias até a próxima ocorrência. 0 = hoje. null = nunca mais (ou não configurada).
function diasAteProximaOcorrencia(item, hoje){
  if(item.tipo === 'diaria') return 0;
  if(item.tipo === 'datas'){
    const base = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    let melhor = null;
    (item.datas || []).forEach(s => {
      const diff = Math.round((dataDeStr(s) - base) / 86400000);
      if(diff >= 0 && (melhor === null || diff < melhor)) melhor = diff;
    });
    return melhor;
  }
  const limite = item.tipo === 'semanal' ? 7 : 62;
  for(let i = 0; i < limite; i++){
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
    if(itemDevidoHoje(item, d)) return i;
  }
  return null;
}

function agoraStrDe(data){
  return String(data.getHours()).padStart(2,'0') + ':' + String(data.getMinutes()).padStart(2,'0');
}

function atualizarPendencias(){
  const hoje = hojeDate();
  const agoraStr = agoraStrDe(hoje);
  let mudou = false;
  itens.forEach(item => {
    const est = estados[item.id] || {};
    const concluidoHoje = est.ultimaConclusao === hojeStr();
    if(!concluidoHoje && !est.pendenteDesde && itemDevidoHoje(item, hoje) && item.hora <= agoraStr){
      estados[item.id] = { ...est, pendenteDesde: hojeStr() };
      mudou = true;
    }
  });
  if(mudou) salvarEstados(estados);
}

function registrarHistorico(id, feito){
  const hj = hojeStr();
  const lista = new Set(historico[hj] || []);
  if(feito) lista.add(id); else lista.delete(id);
  historico[hj] = [...lista];
  gravarJSON(HISTORICO_KEY, historico);
}

function toggleConcluido(item){
  const est = estados[item.id] || {};
  if(est.ultimaConclusao === hojeStr()){
    delete est.ultimaConclusao;
    registrarHistorico(item.id, false);
  }else{
    est.ultimaConclusao = hojeStr();
    registrarHistorico(item.id, true);
    delete est.pendenteDesde;
    if(sonecas[item.id]){ delete sonecas[item.id]; gravarJSON(SONECAS_KEY, sonecas); }
  }
  estados[item.id] = est;
  salvarEstados(estados);
  atualizarPendencias();
  render();
}

function classificarItem(item, hoje){
  const est = estados[item.id] || {};

  if(est.pendenteDesde){
    return { coluna:'atrasada', estado:'atrasada', diasAte: 0, referencia: est.pendenteDesde };
  }

  const devidoHoje = itemDevidoHoje(item, hoje);
  if(devidoHoje){
    if(est.ultimaConclusao === hojeStr()) return { coluna:'hoje-coluna', estado:'feita', diasAte:0 };
    if(item.hora <= agoraStrDe(hoje)) return { coluna:'atrasada', estado:'atrasada', diasAte:0, referencia: hojeStr() };
    return { coluna:'hoje-coluna', estado:'pendente', diasAte:0 };
  }

  const diasAte = diasAteProximaOcorrencia(item, hoje);
  if(item.tipo === 'datas' && diasAte === null) return { coluna:'futura', estado:'encerrada', diasAte: 99999 };
  if(diasAte === 1) return { coluna:'futura', estado:'amanha', diasAte };
  return { coluna:'futura', estado:'distante', diasAte: diasAte === null ? 999 : diasAte };
}

function tagDoItem(item){
  const alarme = item.alarme === false ? '' : ' · ⏰';
  const c = catPorId(item.categoria);
  const pre = c ? c.nome + ' · ' : '';
  return pre + tagBase(item, alarme);
}
function tagBase(item, alarme){
  if(item.tipo === 'semanal'){
    const nomes = (item.dias || []).slice().sort().map(d => DIAS_LABEL[d]).join(' ');
    return 'Semanal · ' + nomes + alarme;
  }
  if(item.tipo === 'mensal') return 'Mensal · dia ' + diasMesDe(item).sort((a,b)=>a-b).join(', ') + alarme;
  if(item.tipo === 'datas'){
    const ds = (item.datas || []).slice().sort();
    const mostra = ds.slice(0,3).map(formatarDataCurta).join(', ');
    return 'Datas · ' + mostra + (ds.length > 3 ? ' +' + (ds.length-3) : '') + alarme;
  }
  return 'Diária' + alarme;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function excluirItem(item){
  if(!confirm('Excluir "' + item.texto + '"?')) return;
  itens = itens.filter(i => i.id !== item.id);
  delete estados[item.id];
  delete sonecas[item.id];
  salvarItens(itens); salvarEstados(estados); gravarJSON(SONECAS_KEY, sonecas);
  render();
}

function montarCard(info, opcoes){
  const { item, estado, referencia } = info;
  const div = document.createElement('div');
  div.className = 'item' + (estado === 'atrasada' ? ' atrasada' : '') + (estado === 'feita' ? ' feito' : '');
  const cat = catPorId(item.categoria);
  if(cat){ div.classList.add('com-cat'); div.style.setProperty('--cat-cor', cat.cor); }
  const badgeAmanha = estado === 'amanha' ? '<span class="badge amanha">amanhã</span>' : '';
  const badgeEnc = estado === 'encerrada' ? '<span class="badge encerrada">encerrada</span>' : '';
  let badgeAtrasada = '';
  if(estado === 'atrasada'){
    badgeAtrasada = (referencia && referencia !== hojeStr())
      ? `<span class="badge atrasada">atrasada desde ${formatarDataCurta(referencia)}</span>`
      : '<span class="badge atrasada">atrasada</span>';
  }
  const mostraCheck = estado === 'atrasada' || estado === 'pendente' || estado === 'feita';
  div.innerHTML = `
    ${mostraCheck ? `<div class="check">${estado === 'feita' ? '✓' : ''}</div>` : ''}
    <div class="hora">${item.hora}</div>
    <div class="miolo">
      <div class="texto">${escapeHtml(item.texto)}${badgeAmanha}${badgeEnc}${badgeAtrasada}</div>
      <div class="tag">${tagDoItem(item)}</div>
      ${item.nota ? `<div class="nota">${escapeHtml(item.nota)}</div>` : ''}
    </div>
    <div class="acoes-card">
      <button type="button" class="btn-icone editar" title="Editar">✎</button>
      <button type="button" class="btn-icone excluir" title="Excluir">✕</button>
    </div>
  `;
  const check = div.querySelector('.check');
  if(check) check.addEventListener('click', () => toggleConcluido(item));
  div.querySelector('.editar').addEventListener('click', () => abrirForm(item));
  div.querySelector('.excluir').addEventListener('click', () => excluirItem(item));
  return div;
}

function itensVisiveis(){
  return filtroCategoria ? itens.filter(i => i.categoria === filtroCategoria) : itens;
}
function montarFiltro(){
  const box = $('filtroCat');
  const usadas = CATEGORIAS.filter(c => itens.some(i => i.categoria === c.id));
  if(filtroCategoria && !usadas.some(c => c.id === filtroCategoria)){ filtroCategoria = ''; }
  if(abaAtual === 'stats' || usadas.length === 0){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = '';
  const todas = document.createElement('button');
  todas.type = 'button'; todas.textContent = 'Todas';
  todas.classList.toggle('ativa', !filtroCategoria);
  todas.addEventListener('click', () => definirFiltro(''));
  box.appendChild(todas);
  usadas.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="cat-ponto" style="background:${c.cor}"></span>${c.nome}`;
    b.classList.toggle('ativa', filtroCategoria === c.id);
    b.addEventListener('click', () => definirFiltro(c.id));
    box.appendChild(b);
  });
}
function definirFiltro(id){
  filtroCategoria = id;
  try{ localStorage.setItem('rotina_filtro_cat', id); }catch(e){}
  render();
}

function render(){
  montarFiltro();
  const lista = $('lista');
  const kpiRow = $('kpiRow');
  lista.innerHTML = '';
  const hoje = hojeDate();

  if(abaAtual === 'stats'){
    kpiRow.style.display = 'none';
    lista.className = 'lista';
    renderStats(lista);
    return;
  }

  if(abaAtual === 'hoje'){
    kpiRow.style.display = 'grid';
    lista.className = 'lista';

    const itensHoje = ordenarPorHora(
      itensVisiveis().filter(i => itemDevidoHoje(i, hoje) || (estados[i.id] && estados[i.id].pendenteDesde))
    );

    if(itensHoje.length === 0){
      lista.innerHTML = '<div class="vazio">Nenhuma ação para hoje. Toque em + para cadastrar.</div>';
    }

    itensHoje.forEach(item => {
      const info = { item, ...classificarItem(item, hoje) };
      lista.appendChild(montarCard(info));
    });

    const total = itensHoje.length;
    const feitos = itensHoje.filter(i => (estados[i.id] || {}).ultimaConclusao === hojeStr()).length;
    $('kpiFeitos').textContent = `${feitos}/${total}`;

    const agoraStr = agoraStrDe(hoje);
    const proximo = itensHoje.find(i => i.hora >= agoraStr && (estados[i.id] || {}).ultimaConclusao !== hojeStr());
    $('kpiProximo').textContent = proximo ? proximo.hora : '--:--';

  }else{
    kpiRow.style.display = 'none';

    const classificados = itensVisiveis().map(item => ({ item, ...classificarItem(item, hoje) }));

    const colunas = [
      { chave:'atrasada',    titulo:'Atrasada', cor:'var(--danger)', vazio:'Nenhuma tarefa atrasada.' },
      { chave:'hoje-coluna', titulo:'Hoje',      cor:'var(--accent)', vazio:'Nada previsto para hoje.' },
      { chave:'futura',      titulo:'Futura',    cor:'var(--text-dim)', vazio:'Nenhuma tarefa futura cadastrada.' }
    ];

    lista.className = modoQuadro === 'colunas' ? 'quadro' : 'lista';

    colunas.forEach(col => {
      const grupo = classificados
        .filter(c => c.coluna === col.chave)
        .sort((a,b) => (a.diasAte - b.diasAte) || a.item.hora.localeCompare(b.item.hora));

      const tituloHtml = `<span class="ponto" style="background:${col.cor}"></span> ${col.titulo} <span class="contagem">${grupo.length}</span>`;
      const destino = modoQuadro === 'colunas' ? document.createElement('div') : lista;
      if(modoQuadro === 'colunas') destino.className = 'coluna-quadro';

      const titulo = document.createElement('div');
      titulo.className = 'coluna-titulo';
      titulo.innerHTML = tituloHtml;
      destino.appendChild(titulo);

      if(grupo.length === 0){
        const vazio = document.createElement('div');
        vazio.className = 'vazio-coluna';
        vazio.textContent = col.vazio;
        destino.appendChild(vazio);
      }else{
        grupo.forEach(g => destino.appendChild(montarCard(g)));
      }
      if(modoQuadro === 'colunas') lista.appendChild(destino);
    });
  }
}

// --- Abas ---
function setAba(aba){
  abaAtual = aba;
  $('tabHoje').classList.toggle('ativa', aba === 'hoje');
  $('tabTodas').classList.toggle('ativa', aba === 'todas');
  $('tabStats').classList.toggle('ativa', aba === 'stats');
  $('modoQuadroRow').style.display = aba === 'todas' ? 'flex' : 'none';
  render();
}
$('tabHoje').addEventListener('click', () => setAba('hoje'));
$('tabTodas').addEventListener('click', () => setAba('todas'));
$('tabStats').addEventListener('click', () => setAba('stats'));
function definirModo(modo){
  modoQuadro = modo;
  try{ localStorage.setItem('rotina_modo_quadro', modo); }catch(e){}
  $('modoColunas').classList.toggle('ativa', modo === 'colunas');
  $('modoEmpilhado').classList.toggle('ativa', modo === 'empilhado');
  render();
}
$('modoColunas').addEventListener('click', () => definirModo('colunas'));
$('modoEmpilhado').addEventListener('click', () => definirModo('empilhado'));
$('modoColunas').classList.toggle('ativa', modoQuadro !== 'empilhado');
$('modoEmpilhado').classList.toggle('ativa', modoQuadro === 'empilhado');

// --- Formulário (nova ação / editar) ---
const overlay = $('overlay');

function atualizarCamposTipo(){
  $('campoDias').style.display = tipoSelecionado === 'semanal' ? 'flex' : 'none';
  $('campoDiaMes').style.display = tipoSelecionado === 'mensal' ? 'flex' : 'none';
  $('campoDatas').style.display = tipoSelecionado === 'datas' ? 'flex' : 'none';
}
function marcarTipo(){
  document.querySelectorAll('.tipo-row button').forEach(b => b.classList.toggle('selecionado', b.dataset.tipo === tipoSelecionado));
  atualizarCamposTipo();
}

function montarDiasSemana(){
  const cont = $('diasSemana');
  cont.innerHTML = '';
  DIAS_LABEL.forEach((label, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.title = DIAS_NOME[idx];
    b.classList.toggle('selecionado', diasSelecionados.includes(idx));
    b.addEventListener('click', () => {
      const pos = diasSelecionados.indexOf(idx);
      if(pos === -1) diasSelecionados.push(idx); else diasSelecionados.splice(pos, 1);
      b.classList.toggle('selecionado');
    });
    cont.appendChild(b);
  });
}

function montarDiasMes(){
  const cont = $('diasMesGrid');
  cont.innerHTML = '';
  for(let n = 1; n <= 31; n++){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = n;
    b.classList.toggle('selecionado', diasMesSelecionados.includes(n));
    b.addEventListener('click', () => {
      const pos = diasMesSelecionados.indexOf(n);
      if(pos === -1) diasMesSelecionados.push(n); else diasMesSelecionados.splice(pos, 1);
      b.classList.toggle('selecionado');
    });
    cont.appendChild(b);
  }
}

function montarCalendario(){
  $('calTitulo').textContent = MESES[calMes] + ' ' + calAno;
  const grade = $('calGrid');
  grade.innerHTML = '';
  DIAS_LABEL.forEach(l => {
    const s = document.createElement('div');
    s.className = 'cal-sem';
    s.textContent = l;
    grade.appendChild(s);
  });
  const primeiro = new Date(calAno, calMes, 1).getDay();
  const total = new Date(calAno, calMes + 1, 0).getDate();
  for(let i = 0; i < primeiro; i++){
    const v = document.createElement('div');
    grade.appendChild(v);
  }
  const hj = hojeStr();
  for(let d = 1; d <= total; d++){
    const s = dataStr(new Date(calAno, calMes, d));
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = d;
    b.dataset.data = s;
    if(s === hj) b.classList.add('hoje');
    if(s < hj && !datasSelecionadas.includes(s)) b.disabled = true;
    if(datasSelecionadas.includes(s)) b.classList.add('selecionado');
    b.addEventListener('click', () => {
      const pos = datasSelecionadas.indexOf(s);
      if(pos === -1) datasSelecionadas.push(s); else datasSelecionadas.splice(pos, 1);
      datasSelecionadas.sort();
      montarCalendario();
      montarChips();
    });
    grade.appendChild(b);
  }
}
function montarChips(){
  const c = $('chipsDatas');
  c.innerHTML = '';
  if(datasSelecionadas.length === 0){
    c.innerHTML = '<span class="chips-vazio">Nenhuma data escolhida ainda.</span>';
    return;
  }
  datasSelecionadas.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = formatarDataLonga(s) + ' ✕';
    chip.addEventListener('click', () => {
      datasSelecionadas = datasSelecionadas.filter(x => x !== s);
      montarCalendario();
      montarChips();
    });
    c.appendChild(chip);
  });
}

// --- Som e vibração do alarme ---
let audioCtx = null;
let somTimer = null;
let somFim = 0;

function garantirAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', garantirAudio, { passive:true });

function bip(freq, dur, inicio){
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    const t0 = audioCtx.currentTime + inicio;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }catch(e){}
}
function cicloSom(){
  if(Date.now() > somFim){ pararSom(); return; }
  garantirAudio();
  bip(880, 0.18, 0); bip(880, 0.18, 0.28); bip(1175, 0.30, 0.56);
  try{ if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]); }catch(e){}
}
function iniciarSom(){
  pararSom();
  somFim = Date.now() + SOM_MAX_MS;
  cicloSom();
  somTimer = setInterval(cicloSom, 1800);
  $('alarmeParar').style.display = 'inline-block';
}
function pararSom(){
  if(somTimer){ clearInterval(somTimer); somTimer = null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}

}

// Dispara lembretes: dentro de JANELA_MIN minutos depois do horário (cobre o caso do app
// ter ficado em segundo plano), avisos de "amanhã" e alarmes adiados.
function checarLembretes(){
  const agora = hojeDate();
  const hj = dataStr(agora);
  const min = agora.getHours()*60 + agora.getMinutes();
  let mudou = false;

  itens.forEach(item => {
    const est = estados[item.id] || {};
    if(itemDevidoHoje(item, agora) && est.ultimaConclusao !== hj){
      const delta = min - minutosDe(item.hora);
      const k = hj + '|h|' + item.id;
      if(delta >= 0 && delta < JANELA_MIN && !disparos[k]){
        disparos[k] = 1; mudou = true;
        avisar(item, false);
      }
    }
    if(item.tipo !== 'diaria' && diasAteProximaOcorrencia(item, agora) === 1){
      const k = hj + '|a|' + item.id;
      if(!disparos[k]){
        disparos[k] = 1; mudou = true;
        notificar(`Amanhã às ${item.hora} · ${item.texto}`, 'rotina-amanha-' + item.id);
      }
    }
  });
  if(mudou) gravarJSON(DISPAROS_KEY, disparos);

  let mudouS = false;
  Object.keys(sonecas).forEach(id => {
    if(Date.now() >= sonecas[id]){
      delete sonecas[id]; mudouS = true;
      const item = itens.find(i => i.id === id);
      const est = estados[id] || {};
      if(item && est.ultimaConclusao !== hj) avisar(item, true);
    }
  });
  if(mudouS) gravarJSON(SONECAS_KEY, sonecas);
}

// --- Estatísticas ---
function statsDoDia(dstr){
  if(dstr < statsInicio) return { total: 0, feitas: 0 };
  const d = dataDeStr(dstr);
  const feitos = new Set(historico[dstr] || []);
  const devidas = itens.filter(i => itemDevidoHoje(i, d) && (!i.criadoEm || i.criadoEm <= dstr));
  return { total: devidas.length, feitas: devidas.filter(i => feitos.has(i.id)).length, devidas, feitos };
}
function diaOffset(n){
  const h = hojeDate();
  return dataStr(new Date(h.getFullYear(), h.getMonth(), h.getDate() - n));
}
function percentualPeriodo(dias){
  let t = 0, f = 0;
  for(let n = 0; n < dias; n++){
    const r = statsDoDia(diaOffset(n));
    t += r.total; f += r.feitas;
  }
  return t ? Math.round(f * 100 / t) : null;
}
function calcularSequencias(){
  // percorre do primeiro dia de estatística até hoje
  const inicio = dataDeStr(statsInicio);
  const hoje = dataDeStr(hojeStr());
  let atual = 0, melhor = 0, corrida = 0;
  for(let d = new Date(inicio); d <= hoje; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)){
    const ds = dataStr(d);
    const r = statsDoDia(ds);
    if(r.total === 0) continue;
    if(r.feitas === r.total){ corrida++; if(corrida > melhor) melhor = corrida; }
    else if(ds === hojeStr()){ /* hoje ainda pode ser completado: não quebra */ }
    else corrida = 0;
  }
  atual = corrida;
  return { atual, melhor };
}
function renderStats(lista){
  const hojeR = statsDoDia(hojeStr());
  const p7 = percentualPeriodo(7), p30 = percentualPeriodo(30);
  const seq = calcularSequencias();
  let totalConcl = 0;
  Object.keys(historico).forEach(k => { if(k >= statsInicio) totalConcl += (historico[k] || []).length; });
  const fmt = v => v === null ? '--' : v + '%';

  // barras dos últimos 7 dias
  let barras = '';
  for(let n = 6; n >= 0; n--){
    const ds = diaOffset(n);
    const r = statsDoDia(ds);
    const pct = r.total ? Math.round(r.feitas * 100 / r.total) : null;
    const alt = pct === null ? 3 : Math.max(3, pct);
    const cls = pct === null ? 'vazia' : (pct === 100 ? 'cheia' : '');
    const nome = DIAS_NOME[dataDeStr(ds).getDay()].slice(0,3);
    barras += `<div class="barra-col"><div class="barra-pct">${pct === null ? '' : pct + '%'}</div><div class="barra ${cls}" style="height:${alt}%"></div><div class="barra-dia">${nome}</div></div>`;
  }

  // tarefas mais esquecidas nos últimos 30 dias
  const resumo = {};
  for(let n = 0; n < 30; n++){
    const r = statsDoDia(diaOffset(n));
    if(!r.devidas) continue;
    r.devidas.forEach(i => {
      const x = resumo[i.id] || (resumo[i.id] = { texto: i.texto, tot: 0, ok: 0 });
      x.tot++; if(r.feitos.has(i.id)) x.ok++;
    });
  }
  const falhas = Object.values(resumo).filter(x => x.tot - x.ok > 0)
    .sort((a,b) => (b.tot - b.ok) - (a.tot - a.ok)).slice(0,3);
  const rank = falhas.length
    ? falhas.map(x => `<div class="rank-linha"><span>${escapeHtml(x.texto)}</span><span>${x.tot - x.ok} de ${x.tot} falhas</span></div>`).join('')
    : '<div class="vazio-coluna">Nenhuma falha registrada ainda.</div>';

  lista.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="rot">Hoje</div><div class="val">${hojeR.feitas}/${hojeR.total}</div><div class="sub">tarefas concluídas</div></div>
      <div class="stat"><div class="rot">Sequência</div><div class="val">${seq.atual}</div><div class="sub">dias seguidos com tudo feito (melhor: ${seq.melhor})</div></div>
      <div class="stat"><div class="rot">Últimos 7 dias</div><div class="val">${fmt(p7)}</div><div class="sub">de tarefas cumpridas</div></div>
      <div class="stat"><div class="rot">Últimos 30 dias</div><div class="val">${fmt(p30)}</div><div class="sub">de tarefas cumpridas</div></div>
    </div>
    <div class="stat-bloco"><h3>Últimos 7 dias</h3><div class="barras">${barras}</div></div>
    <div class="stat-bloco"><h3>Tarefas que mais falharam (30 dias)</h3>${rank}</div>
    <div class="stat-bloco"><div class="rot" style="font-size:11px;color:var(--text-dim)">Total concluído desde ${formatarDataCurta(statsInicio)}</div><div class="val" style="font-family:'DM Mono',monospace;font-size:26px;color:var(--accent)">${totalConcl}</div></div>
    <div class="ajuda">As estatísticas começam a contar a partir do dia ${formatarDataCurta(statsInicio)}, quando este recurso foi instalado. Dias sem tarefas previstas não entram na conta.</div>
  `;
}

function baixarArquivo(nome, conteudo, tipo){

function gerarBackup(){
  return JSON.stringify({ app: 'rotina-diaria', versao: 1, exportadoEm: new Date().toISOString(), itens, estados, historico, statsInicio }, null, 2);
}
function itemValido(i){
  return i && typeof i.id === 'string' && /^\d{2}:\d{2}$/.test(i.hora || '') && typeof i.texto === 'string' &&
    ['diaria','semanal','mensal','datas'].includes(i.tipo);
}
function restaurarBackup(texto){
  let obj;
  try{ obj = JSON.parse(texto); }catch(e){ return 'Arquivo inválido.'; }
  if(!obj || obj.app !== 'rotina-diaria' || !Array.isArray(obj.itens)) return 'Este arquivo não é um backup do Rotina Diária.';
  const validos = obj.itens.filter(itemValido);
  if(validos.length === 0 && obj.itens.length > 0) return 'Nenhuma tarefa válida no arquivo.';
  itens = validos;
  estados = (obj.estados && typeof obj.estados === 'object') ? obj.estados : {};
  historico = (obj.historico && typeof obj.historico === 'object') ? obj.historico : {};
  if(typeof obj.statsInicio === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(obj.statsInicio)){
    statsInicio = obj.statsInicio;
    try{ localStorage.setItem(INICIO_KEY, statsInicio); }catch(e){}
  }
  gravarJSON(HISTORICO_KEY, historico);
  disparos = {}; sonecas = {};
  salvarItens(itens); salvarEstados(estados);
  gravarJSON(DISPAROS_KEY, disparos); gravarJSON(SONECAS_KEY, sonecas);
  atualizarPendencias(); render();
  return validos.length + ' tarefa(s) restaurada(s).';
}

function icsEscape(t){
  return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsData(dstr, hhmm, addMin){
  const d = dataDeStr(dstr);
  const m = minutosDe(hhmm) + (addMin || 0);
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, m);
  return dataStr(dd).replace(/-/g,'') + 'T' + String(dd.getHours()).padStart(2,'0') + String(dd.getMinutes()).padStart(2,'0') + '00';
}
function gerarICS(){
  const hoje = hojeDate();
  const carimbo = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rotina Diaria//PT-BR','CALSCALE:GREGORIAN'];
  const BYDAY = ['SU','MO','TU','WE','TH','FR','SA'];
  let qtd = 0;
  itens.forEach(item => {
    // primeira ocorrência a partir de hoje
    let inicio = null;
    if(item.tipo === 'datas'){
      inicio = (item.datas || []).slice().sort().find(s => s >= dataStr(hoje)) || null;
    }else{
      for(let i = 0; i < 400; i++){
        const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
        if(itemDevidoHoje(item, d)){ inicio = dataStr(d); break; }
      }
    }
    if(!inicio) return;
    qtd++;
    linhas.push('BEGIN:VEVENT');
    linhas.push('UID:' + item.id + '@rotina-diaria');
    linhas.push('DTSTAMP:' + carimbo);
    linhas.push('DTSTART:' + icsData(inicio, item.hora, 0));
    linhas.push('DTEND:' + icsData(inicio, item.hora, 15));
    linhas.push('SUMMARY:' + icsEscape(item.texto));
    if(item.nota) linhas.push('DESCRIPTION:' + icsEscape(item.nota));
    if(catPorId(item.categoria)) linhas.push('CATEGORIES:' + icsEscape(catPorId(item.categoria).nome));
    if(item.tipo === 'diaria') linhas.push('RRULE:FREQ=DAILY');
    if(item.tipo === 'semanal') linhas.push('RRULE:FREQ=WEEKLY;BYDAY=' + (item.dias || []).slice().sort().map(d => BYDAY[d]).join(','));
    if(item.tipo === 'mensal') linhas.push('RRULE:FREQ=MONTHLY;BYMONTHDAY=' + diasMesDe(item).sort((a,b)=>a-b).join(','));
    if(item.tipo === 'datas'){
      const extras = (item.datas || []).slice().sort().filter(s => s > inicio);
      if(extras.length) linhas.push('RDATE:' + extras.map(s => icsData(s, item.hora, 0)).join(','));
    }
    linhas.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:' + icsEscape(item.texto),'TRIGGER:PT0S','END:VALARM');
    linhas.push('END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  return { texto: linhas.join('\r\n') + '\r\n', qtd };
}

$('btnBackup').addEventListener('click', () => {
  baixarArquivo('rotina-backup-' + hojeStr() + '.json', gerarBackup(), 'application/json');
  msgFerr('Backup salvo na pasta Downloads do celular.');
});
$('btnRestaurar').addEventListener('click', () => $('arqBackup').click());
$('arqBackup').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(!confirm('Restaurar vai substituir as tarefas atuais pelas do arquivo. Continuar?')){ e.target.value = ''; return; }
  const leitor = new FileReader();
  leitor.onload = () => { msgFerr(restaurarBackup(String(leitor.result))); e.target.value = ''; };
  leitor.onerror = () => msgFerr('Não consegui ler o arquivo.');
  leitor.readAsText(f);
});
$('btnIcs').addEventListener('click', () => {
  const r = gerarICS();
  if(r.qtd === 0){ msgFerr('Nenhuma tarefa com data futura para enviar.'); return; }
  baixarArquivo('rotina-agenda.ics', r.texto, 'text/calendar');
  msgFerr(r.qtd + ' tarefa(s) no arquivo. Abra o arquivo baixado e escolha o app Agenda do Google.');
});

// Tela sempre acesa (Wake Lock). Só funciona com o app aberto na tela.
let wakeLock = null;
let telaAcesa = false;
try{ telaAcesa = localStorage.getItem('rotina_tela_acesa') === '1'; }catch(e){}
function atualizarBtnTela(){
  $('btnTela').textContent = 'Tela sempre acesa: ' + (telaAcesa ? 'ligada' : 'desligada');
  $('btnTela').classList.toggle('ligado', telaAcesa);
}
async function pedirWakeLock(){
  if(!telaAcesa || !('wakeLock' in navigator) || document.hidden) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){}
}
$('btnTela').addEventListener('click', async () => {
  if(!('wakeLock' in navigator)){ msgFerr('Este navegador não permite manter a tela acesa.'); return; }
  telaAcesa = !telaAcesa;
  try{ localStorage.setItem('rotina_tela_acesa', telaAcesa ? '1' : '0'); }catch(e){}
  if(telaAcesa) await pedirWakeLock();
  else if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
  atualizarBtnTela();
  msgFerr(telaAcesa ? 'A tela fica acesa enquanto o app estiver aberto. Isso gasta mais bateria.' : 'Tela acesa desligada.');
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && telaAcesa && !wakeLock) pedirWakeLock(); });
atualizarBtnTela();
pedirWakeLock();

limparDisparosAntigos();
atualizarPendencias();
render();
atualizarStatusBanner();
checarLembretes();
</script>
